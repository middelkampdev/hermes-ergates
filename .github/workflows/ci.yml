# Every job runs scripts/ci-local.sh, so a local run executes the same commands.
name: CI

on:
  # gflow lands every change through a pull request into one of these branches
  # (.gflow/config, mode=protected), so branch protection can require these
  # jobs. `master` and `develop` also run on the push after a merge. Other
  # branches get CI through their pull request; a push trigger for them too
  # would run every job twice per commit (push and pull_request runs land in
  # different concurrency groups). Release tags run release.yml instead.
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop, "release/**", "hotfix/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.19"
      - run: scripts/ci-local.sh lint

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: scripts/ci-local.sh mobile

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.19"
      - run: scripts/ci-local.sh integration

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check out Hermes at the pin
        uses: actions/checkout@v7
        with:
          repository: NousResearch/hermes-agent
          # Same pin in scripts/ci-local.sh and integrations/ergates/contract/pinned.py (HERMES_PIN).
          ref: d76856cc6971b6e0e1903b5369498bcc4bb83a60
          path: .cache/hermes-pin
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.19"
      - run: scripts/ci-local.sh contract
        env:
          HERMES_SOURCE: ${{ github.workspace }}/.cache/hermes-pin

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.19"
      - run: scripts/ci-local.sh deploy
