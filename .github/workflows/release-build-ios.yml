# Reusable: builds the signed App Store .ipa of a store release
# (apps/mobile/RELEASING.md). release.yml calls it. The job runs in the
# app-stores environment and reads that environment's secrets itself: a caller
# cannot pass environment secrets to a reusable workflow.
name: Release build iOS

on:
  workflow_call:
    inputs:
      build-number:
        description: iOS CFBundleVersion
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    environment: app-stores
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Expo SDK 57 needs Xcode 26.4 or later.
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1.7.0
        with:
          xcode-version: latest-stable
      # No cache: npm here. This job holds the iOS signing secrets, and a
      # restored cache can carry entries written by any other workflow run on
      # this repository's default branch (docs.github.com, "Dependency
      # caching" reference); npm ci's lockfile integrity check limits but
      # does not remove that risk. checks (no secret, ships nothing) keeps
      # the cache instead.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --no-fund
      - name: Build the signed .ipa
        working-directory: apps/mobile
        env:
          BUILD_NUMBER: ${{ inputs.build-number }}
          OUTPUT_DIR: ${{ runner.temp }}/release
          # The plugin commit the app installs (app.config.ts). In a reusable workflow github.sha is the
          # caller's, the release tag's commit; a malformed value fails the build instead of shipping none.
          ERGATES_PLUGIN_COMMIT: ${{ github.sha }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APPSTORE_PROFILE_BASE64: ${{ secrets.IOS_APPSTORE_PROFILE_BASE64 }}
        run: scripts/release/build-ios.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-release
          path: ${{ runner.temp }}/release/ergates.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Delete the signing keychain and profile
        if: always()
        working-directory: apps/mobile
        run: scripts/release/build-ios.sh --cleanup
