# Ergates single-VPS deployment -- CHECKED BY CI, NOT YET RUN ON A VPS.
#
# `scripts/ci-local.sh deploy` runs `docker compose config` on this file and
# `deploy/tests/test_static.py` checks the wiring rules below. It has not
# been started end-to-end on a VPS: deploy/VERIFY.md is the owner's list of
# live checks, and deploy/README.md is the runbook.
#
# Wiring (docs/03-technical-design.md section 9):
#   - hermes-serve and hermes-gateway share one /opt/data volume and both get
#     the host Docker socket: both execute tools. Shell sandboxes (spawned
#     through terminal.backend: docker from a profile's config.yaml, not a
#     service here) never get that socket and run with no network.
#   - The controllers and ntfy sit only on `internal`, a network with no
#     route out and no gateway address on the host (Docker Engine 28.0 or
#     later). Their one network path out is `egress-proxy`, which allows HTTPS
#     to the hosts in proxy/allowed-domains.txt and nothing else, so a client
#     that ignores the proxy settings cannot reach the internet or a service
#     on the host either. This constrains network clients, not a compromised
#     controller: code running in a controller can use its Docker socket to
#     start a container outside this network.
#   - `ingress` is the one published door: it forwards the VPS's Tailscale IP
#     ports 9119 (hermes serve) and NTFY_PORT (ntfy) as plain TCP to the
#     internal services. Nothing is published on 0.0.0.0, and no service uses
#     the host network.
#   - Every image is pinned by tag and digest. The digests are the multi-arch
#     index digests registry-1.docker.io reported on 2026-09-25; deploy/README.md
#     "Update" says how to move one.
#   - The integration plugin is bind-mounted read-only into both controllers
#     at /opt/data/plugins/ergates, the user-plugin folder Hermes scans. The
#     reviewed proposal templates sit in the plugin's own templates/ folder, so
#     they need no mount of their own. hermes-serve runs the plugin's periodic
#     sweep on a thread of its own; no host cron line is needed
#     (deploy/README.md "Periodic sweep").
#
# No credentials live in this file or in .env.example -- every secret is a
# required, unset-by-default variable resolved from a real .env you create
# from .env.example (see deploy/README.md "First-run credential provisioning").

# Outbound HTTP(S) of a service on `internal` goes through the proxy. Python,
# Go and curl read these variables; the lower-case names are the ones curl
# reads for plain HTTP. Internal names bypass the proxy.
x-through-the-egress-proxy: &through-the-egress-proxy
  HTTP_PROXY: http://egress-proxy:3128
  HTTPS_PROXY: http://egress-proxy:3128
  NO_PROXY: localhost,127.0.0.1,ntfy,hermes-serve,hermes-gateway,egress-proxy,ingress
  http_proxy: http://egress-proxy:3128
  https_proxy: http://egress-proxy:3128
  no_proxy: localhost,127.0.0.1,ntfy,hermes-serve,hermes-gateway,egress-proxy,ingress

services:
  hermes-serve:
    # Hermes v0.21.6 (818c13be), the commit the integration's contract tests
    # run against. The registry's plain `v0.21.6` tag is an older build from an
    # abandoned release candidate; `rc.4-v0.21.6` is the release's own image
    # (the `stable` and `latest` tags point at it too). The digest is what
    # Docker pulls. deploy/VERIFY.md has the owner's check.
    image: nousresearch/hermes-agent:rc.4-v0.21.6@sha256:9774f4f39a9bb8c2f68ce728ed5e99ddbad282163be56764afacf88ed952b784
    container_name: ergates-hermes-serve
    restart: unless-stopped
    # Do not override the image's default entrypoint (s6-overlay's /init):
    # it drops privileges to the non-root `hermes` user for every supervised
    # service, including this command. Only the command (CMD) is overridden.
    # 0.0.0.0 inside the container: the Tailscale IP exists only on the host,
    # and `ingress` is what publishes this port there. A non-loopback bind
    # keeps Hermes's dashboard auth on from the first request. Binding 0.0.0.0
    # also turns off Hermes's Host-header check against DNS rebinding
    # (hermes_cli/web_server.py accepts any Host then); the auth gate stays on.
    command: ["hermes", "serve", "--host", "0.0.0.0", "--port", "9119", "--skip-build"]
    environment:
      <<: *through-the-egress-proxy
      HERMES_HOME: /opt/data
      # The plugin here is a read-only mount, not an install Hermes made and
      # recorded. This marker is how the plugin's `health` route says so.
      # Only this service answers `health`.
      ERGATES_INSTALL_KIND: deployment
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:?set in .env -- never commit a real value}
      # Hash, not plaintext (04 section 6: "password hash where supported").
      # The stock provider prefers password_hash and only hashes a plaintext
      # in memory as a fallback (plugins/dashboard_auth/basic/__init__.py).
      # Escape every '$' in the .env value as '$$' -- Compose interpolates .env
      # values, and an scrypt hash is full of them. See deploy/README.md.
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD_HASH:?set in .env -- never commit a real value}
      # Fallback only, normally empty. A NON-EMPTY value here takes precedence
      # over the hash above (the provider hashes it in memory and logs that it
      # did), so leave it unset unless you are deliberately falling back.
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:-}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:?set in .env -- never commit a real value}
    volumes:
      - ${HERMES_DATA_DIR:-./data/hermes}:/opt/data
      # The Ergates integration plugin, read-only. Hermes discovers user
      # plugins at get_hermes_home()/plugins (hermes_cli/plugins_discovery.py),
      # and HERMES_HOME is /opt/data here, so this path is what makes the
      # plugin exist in the deployed stack at all.
      - ../integrations/ergates:/opt/data/plugins/ergates:ro
      # Host Docker daemon access, restricted to this trusted controller
      # (03 section 9). This is NOT the same socket a shell sandbox gets --
      # profiles must keep terminal.docker_network / socket access off; see
      # deploy/profiles/*/config.yaml and 04 section 7.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
    depends_on:
      - egress-proxy
    # The image's own setup adds the `hermes` user to the socket's group at
    # boot (docker/stage2-hook.sh in Hermes v0.21.6); group_add stays as a
    # second route. deploy/VERIFY.md checks it on the VPS.
    group_add:
      - "${DOCKER_SOCK_GID:?set DOCKER_SOCK_GID in .env -- see .env.example}"

  hermes-gateway:
    # The same image as hermes-serve: both controllers run from one data root.
    image: nousresearch/hermes-agent:rc.4-v0.21.6@sha256:9774f4f39a9bb8c2f68ce728ed5e99ddbad282163be56764afacf88ed952b784
    container_name: ergates-hermes-gateway
    restart: unless-stopped
    command: ["hermes", "gateway", "run"]
    environment:
      <<: *through-the-egress-proxy
      HERMES_HOME: /opt/data
    volumes:
      - ${HERMES_DATA_DIR:-./data/hermes}:/opt/data
      # Same read-only plugin mount as hermes-serve: the gateway is where the
      # approval hooks actually fire (tools/approval_gateway_wait.py), so the
      # plugin has to be discoverable in this container too.
      - ../integrations/ergates:/opt/data/plugins/ergates:ro
      # Both serve and gateway execute tools; mounting the socket into only
      # one of them is insufficient (03 section 9).
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
    depends_on:
      - egress-proxy
    group_add:
      - "${DOCKER_SOCK_GID:?set DOCKER_SOCK_GID in .env -- see .env.example}"

  ntfy:
    image: binwiederhier/ntfy:v2.28.0@sha256:6ef4b819f722fccdc036af611c4774cfdc2de821ab74fdd48bbf4c9d6f8973da
    container_name: ergates-ntfy
    restart: unless-stopped
    command: ["serve"]
    environment:
      <<: *through-the-egress-proxy
      # The URL phones subscribe with. ntfy refuses to start with an upstream
      # but no base URL, and hashes this URL into every iOS poll request.
      NTFY_BASE_URL: http://${TAILSCALE_IP:?set TAILSCALE_IP in .env -- see .env.example}:${NTFY_PORT:-8080}
      # Self-hosted iOS instant delivery needs a public upstream wake-up
      # service; the phone then fetches the real message from this private
      # server (11 section 4.2; docs.ntfy.sh/config/#ios-instant-notifications).
      # ntfy.sh is on the proxy's allowlist for this.
      NTFY_UPSTREAM_BASE_URL: ${NTFY_UPSTREAM_BASE_URL:-https://ntfy.sh}
      # Deny-by-default ACL: no topic is readable or writable until a token
      # is granted access. Provision the publish token and per-device
      # subscriptions during first-run credential provisioning (see README).
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_AUTH_FILE: /var/lib/ntfy/auth.db
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_BEHIND_PROXY: "false"
    volumes:
      # Persisted cache/auth stores (03 section 9), so tokens and the
      # message cache survive a container recreation.
      - ${NTFY_DATA_DIR:-./data/ntfy}:/var/lib/ntfy
    networks:
      - internal
    depends_on:
      - egress-proxy

  egress-proxy:
    # Squid 6.6 on Ubuntu 24.04 LTS (Canonical's image; `edge` is its most
    # recently patched 24.04 channel).
    image: ubuntu/squid:6.6-24.04_edge@sha256:8a3baed477e2c282ab8aa5edad442f69873246964f225c5c2ae8364b6610963c
    container_name: ergates-egress-proxy
    restart: unless-stopped
    volumes:
      - ./proxy/squid.conf:/etc/squid/squid.conf:ro
      - ./proxy/allowed-domains.txt:/etc/squid/allowed-domains.txt:ro
      # EGRESS_MODE (.env) picks the file: unset or "standard" mounts
      # mode-standard.conf, "strict" mounts mode-strict.conf. The long
      # syntax with create_host_path: false is meant to make a mistyped
      # mode a missing host file Docker refuses to start from, not an
      # empty directory it creates and silently mounts. Docker documents
      # the error for a missing --mount source; VERIFY.md V3 "A mistyped
      # mode stops the proxy" confirms it for Compose once.
      - type: bind
        source: ./proxy/mode-${EGRESS_MODE:-standard}.conf
        target: /etc/squid/mode.conf
        read_only: true
        bind:
          create_host_path: false
    networks:
      - internal
      - edge

  ingress:
    image: haproxy:3.4.5-alpine@sha256:4ebeea8b11f17f1fe044fba65cbc42f94e478d6d3ee223f59cacaf2621ecf8a1
    container_name: ergates-ingress
    restart: unless-stopped
    volumes:
      - ./ingress/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    ports:
      # Bind only to the VPS's Tailscale IP -- never 0.0.0.0 (03 section 9).
      - "${TAILSCALE_IP:?set TAILSCALE_IP in .env -- see .env.example}:9119:9119"
      - "${TAILSCALE_IP:?set TAILSCALE_IP in .env -- see .env.example}:${NTFY_PORT:-8080}:8080"
    networks:
      - internal
      - edge
    depends_on:
      - hermes-serve
      - ntfy

networks:
  # No route out: the controllers and ntfy reach the internet only through
  # egress-proxy. Docker publishes no port of a container that sits only on
  # an internal network, which is why `ingress` exists.
  internal:
    driver: bridge
    internal: true
    # By default an internal bridge still has an address on the host, and
    # containers reach host services listening on 0.0.0.0 (sshd, for one)
    # through it. The isolated gateway mode assigns none; it needs Docker
    # Engine 28.0 or later. IPv6 stays off, so no IPv6 gateway replaces it.
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
    enable_ipv6: false
  # The proxy's way out and the ingress's published ports.
  edge:
    driver: bridge

# Deliberately out of scope (see deploy/README.md):
#   - A Tailscale container/sidecar. This file assumes Tailscale is already
#     installed and connected on the host VPS, and that ${TAILSCALE_IP} is
#     that host's Tailscale interface address.
#   - The optional admin SPA / dashboard-only endpoint.
