# The tests of the Ergates plugin. They live outside integrations/ergates so
# the folder users install holds only runtime code, which Hermes's install
# scan rates `safe`. This project is never built: uv installs the plugin as
# an editable dependency and runs pytest from here. Its uv.lock is committed,
# so every CI run tests with the same pytest, pytest-cov and PyYAML versions;
# it records the plugin version, which .gflow/set-version.sh writes.
[project]
name = "ergates-tests"
version = "0"
requires-python = ">=3.11"
# The plugin's runtime stays standard-library only. PyYAML is a test
# dependency: `python -m ergates.flush` parses the profile's config.yaml so no
# credential ever reaches a command line, and it imports yaml lazily from the
# Hermes runtime, which ships it.
dependencies = ["ergates", "pytest>=7.4", "pytest-cov", "pyyaml>=6.0"]

[tool.uv]
package = false

[tool.uv.sources]
ergates = { path = "../ergates", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
# plugin_tree.py sits next to this file and is imported by tests/, contract/ and contract/live/.
pythonpath = ["."]

[tool.coverage.run]
source = ["ergates"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
