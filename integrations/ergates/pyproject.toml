[project]
name = "ergates"
version = "0.2.0"
description = "Ergates integration package for Hermes Agent: agent proposals, reminders, and attention/push notifications."
requires-python = ">=3.11"
# Standard library only at runtime. The tests and their dependencies are a
# separate project, integrations/ergates-tests in the repository.
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ergates*"]
